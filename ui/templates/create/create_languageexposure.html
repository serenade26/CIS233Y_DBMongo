{% extends "default.html" %}
{% block title %}Create a new Language that I've had an experience with{%  endblock %}
{% block header %}Enter the Language information, with history of its usage:{% endblock %}
{% block content %}
    <form method="POST" action="do_create_languageexposure">
        <table class="data_entry_form">
            <tr><th><label>Name:</label></th><td><input type="text" name="name"></td></tr>
            <tr><th><label>Application Domain:</label></th><td><input type="text" name="application_domain"></td></tr>
            <tr><th><label>Programming Paradigm:</label></th><td><input type="text" name="programming_paradigm"></td></tr>
            <tr><th><label>Execution Method:</label></th><td><input type="text" name="execution_method"></td></tr>
            <tr><th><label>Typing:</label></th><td><input type="text" name="typing"></td></tr>
            <tr><th><label>Year last used:</label></th><td><input type="text" name="year_last_used" pattern="\d{4}"></td></tr>
            <tr><th><label>Years of exposure:</label></th><td><input type="number" name="years_of_exposure" min="0" max="100" step="0.01"></td></tr>
            <tr><th><label>Version Last Used:</label></th><td><input type="text" name="version_last_used"></td></tr>
            <tr><th colspan="2"><button type="submit">CREATE</button></th></tr>
        </table>
    </form>
{% endblock %}
